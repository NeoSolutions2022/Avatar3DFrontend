<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img"><title>Tempo de consultas HTTPS ao mesmo resultado concluído</title><rect width="1600" height="980" fill="#ffffff"/><text x="80" y="65" font-family="Arial,sans-serif" font-size="22" fill="#007da8" >NeoTalk · PERF-03 · 26/10/2026</text><text x="80" y="112" font-family="Arial,sans-serif" font-size="40" fill="#10233f" >Reuso de conexão no proxy de poses</text><text x="80" y="153" font-family="Arial,sans-serif" font-size="23" fill="#52657f" >HTTPS real · mesmo resultado concluído · 6 rodadas alternadas × 3 consultas por variante</text><rect x="80" y="195" width="26" height="14" rx="3" fill="#61748c"/><text x="120" y="212" font-family="Arial,sans-serif" font-size="22" fill="#21324a" >urllib · conexão por chamada</text><rect x="700" y="195" width="26" height="14" rx="3" fill="#078261"/><text x="740" y="212" font-family="Arial,sans-serif" font-size="22" fill="#21324a" >pool · transporte reutilizado</text><line x1="120" y1="560" x2="1490" y2="560" stroke="#dbe3ed"/><text x="103" y="567" font-family="Arial,sans-serif" font-size="20" fill="#52657f" text-anchor="end">0</text><line x1="120" y1="460" x2="1490" y2="460" stroke="#dbe3ed"/><text x="103" y="467" font-family="Arial,sans-serif" font-size="20" fill="#52657f" text-anchor="end">600</text><line x1="120" y1="360" x2="1490" y2="360" stroke="#dbe3ed"/><text x="103" y="367" font-family="Arial,sans-serif" font-size="20" fill="#52657f" text-anchor="end">1200</text><line x1="120" y1="260" x2="1490" y2="260" stroke="#dbe3ed"/><text x="103" y="267" font-family="Arial,sans-serif" font-size="20" fill="#52657f" text-anchor="end">1800</text><text x="80" y="248" font-family="Arial,sans-serif" font-size="19" fill="#52657f" >ms por rodada</text><rect x="155" y="309.56868333326076" width="62" height="250.43131666673924" rx="4" fill="#61748c"/><text x="186" y="297.56868333326076" font-family="Arial,sans-serif" font-size="20" fill="#61748c" t