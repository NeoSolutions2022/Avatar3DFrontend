nt-family="Arial,sans-serif" font-size="22" fill="#52657f" text-anchor="middle">Rodada 4</text><rect x="1055" y="308.50346666668577" width="62" height="251.49653333331423" rx="4" fill="#61748c"/><text x="1086" y="296.50346666668577" font-family="Arial,sans-serif" font-size="20" fill="#61748c" text-anchor="middle">1509</text><rect x="1131" y="423.028116666707" width="62" height="136.97188333329302" rx="4" fill="#078261"/><text x="1162" y="411.028116666707" font-family="Arial,sans-serif" font-size="20" fill="#078261" text-anchor="middle">822</text><text x="1130" y="604" font-family="Arial,sans-serif" font-size="22" fill="#52657f" text-anchor="middle">Rodada 5</text><rect x="1280" y="307.6204500000373" width="62" height="252.3795499999627" rx="4" fill="#61748c"/><text x="1311" y="295.6204500000373" font-family="Arial,sans-serif" font-size="20" fill="#61748c" text-anchor="middle">1514</text><rect x="1356" y="424.8587666666572" width="62" height="135.14123333334283" rx="4" fill="#078261"/><text x="1387" y="412.8587666666572" font-family="Arial,sans-serif" font-size="20" fill="#078261" text-anchor="middle">811</text><text x="1355" y="604" font-family="Arial,sans-serif" font-size="22" fill="#52657f" text-anchor="middle">Rodada 6</text><text x="90" y="680" font-family="Arial,sans-serif" font-size="24" fill="#21324a" >Média por rodada (inclui abrir/fechar cliente)</text><text x="90" y="728" font-family="Arial,sans-serif" font-size="38" fill="#10233f" >1502,2 ms → 824,9 ms</text><text x="1000" y="690" font-family="Arial,sans-serif" font-size="32" fill="#078261" >45,1% menos tempo</text><text x="1000" y="729" font-family="Arial,sans-serif" font-size="22" fill="#52657f" >somente neste componente/ensaio</text><line x1="80" y1="780" x2="1520" y2="780" stroke="#dbe3ed"/><text x="80" y="820" font-family="Arial,sans-serif" font-size="23" fill="#21324a" >Respostas equivalentes em todas as 36 consultas. Sem latência artificial.</text><text x="80" y="862" font-family="Arial,sans-serif" font-size="22" fill="#52657f" >A primeira conexão continua fria. p95 por chamada: 524,6 → 505,8 ms (18 amostras por variante).</text><text x="80" y="904" font-family="Arial,sans-serif" font-size="22" fill="#52657f" >Não mede geração de poses, GPT, áudio ou Unity. Não demonstra ganho ponta a ponta na sala.</text><text x="80" y="945" font-family="Arial,sans-serif" font-size="21" fill="#52657f" >Uma tarefa sintética já concluída; condições do endpoint e da rede limitam a generalização.</text></svg>