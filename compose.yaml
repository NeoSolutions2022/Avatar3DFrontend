services:
  avatar3d:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${AVATAR3D_IMAGE:-neotalk/avatar3d:local}
    restart: unless-stopped
    ports:
      - "${AVATAR3D_HTTP_PORT:-8080}:8080"
    environment:
      AVATAR3D_HOST: 0.0.0.0
      AVATAR3D_PORT: 8080
      AVATAR3D_DATA_DIR: /data
      AVATAR3D_FRONTEND_DIR: /app/frontend
      AVATAR3D_WEBGL_DIR: /app/webgl
      AVATAR3D_CORS_ORIGINS: ${AVATAR3D_CORS_ORIGINS:-*}
      AVATAR3D_WIDGET_ORIGINS: ${AVATAR3D_WIDGET_ORIGINS:-*}
      AVATAR3D_API_KEY: ${AVATAR3D_API_KEY:-}
      AVATAR3D_MAX_POSE_BYTES: ${AVATAR3D_MAX_POSE_BYTES:-20971520}
      AVATAR3D_MAX_POSE_FRAMES: ${AVATAR3D_MAX_POSE_FRAMES:-10000}
      AVATAR3D_KEEP_ORIGINALS: ${AVATAR3D_KEEP_ORIGINALS:-true}
      AVATAR3D_LOG_LEVEL: ${AVATAR3D_LOG_LEVEL:-info}
      NEOTALK_API_BASE_URL: ${NEOTALK_API_BASE_URL:-https://infra-neotalk-api.k3p3ex.easypanel.host}
      NEOTALK_API_KEY: ${NEOTALK_API_KEY:-}
      NEOTALK_API_TIMEOUT_SECONDS: ${NEOTALK_API_TIMEOUT_SECONDS:-30}
      NEOTALK_MVP_POSE_FPS: ${NEOTALK_MVP_POSE_FPS:-30}
    volumes:
      - avatar3d_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  avatar3d_data:
