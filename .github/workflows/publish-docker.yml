name: Publicar Avatar 3D no GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/neosolutions2022/avatar3dfrontend

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio e arquivos Git LFS
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Verificar binarios WebGL
        shell: bash
        run: |
          data_size=$(stat -c%s webgl/Build/webgl.data)
          wasm_size=$(stat -c%s webgl/Build/webgl.wasm)

          echo "webgl.data: ${data_size} bytes"
          echo "webgl.wasm: ${wasm_size} bytes"

          test "${data_size}" -gt 100000000
          test "${wasm_size}" -gt 40000000

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/neosolutions2022/avatar3dfrontend:latest
            ghcr.io/neosolutions2022/avatar3dfrontend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
